<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Rules Study - About You</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <section class="panel" id="demographics-panel">
      <h2>About You</h2>
      <p>Please answer these final questions about yourself.</p>

      <div id="randomizable-fields">
        <label class="field">
          <span>Age</span>
          <input id="demo-age" type="number" min="18" max="100" placeholder="Enter your age" />
        </label>

        <label class="field">
          <span>Gender</span>
          <select id="demo-gender">
            <option value="" selected disabled>Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Prefer not to say">Prefer not to say</option>
          </select>
        </label>

        <label class="field">
          <span>District and State of residence</span>
          <input id="demo-location" type="text" placeholder="e.g., Bangalore, Karnataka" />
        </label>

        <label class="field">
          <span>Education level</span>
          <select id="demo-education">
            <option value="" selected disabled>Select your highest education</option>
            <option value="No school education">No school education</option>
            <option value="Primary school">Primary school</option>
            <option value="High school">High school</option>
            <option value="Diploma">Diploma</option>
            <option value="Bachelor's">Bachelor's</option>
            <option value="Master's">Master's</option>
            <option value="Doctoral">Doctoral</option>
          </select>
        </label>

        <label class="field">
          <span>How often do you use WhatsApp?</span>
          <select id="demo-wa-frequency">
            <option value="" selected disabled>Select</option>
            <option value="Never">Never</option>
            <option value="Rarely">Rarely</option>
            <option value="Sometimes">Sometimes</option>
            <option value="Often">Often</option>
            <option value="Daily">Daily</option>
          </select>
        </label>

        <label class="field">
          <span>How many WhatsApp groups do you serve as an admin or moderator?</span>
          <select id="demo-wa-admin-groups">
            <option value="" selected disabled>Select</option>
            <option value="0">0</option>
            <option value="1-3">1-3</option>
            <option value="4-7">4-7</option>
            <option value="8-15">8-15</option>
            <option value="16+">16+</option>
          </select>
        </label>

        <label class="field">
          <span>How long have you been a WhatsApp admin?</span>
          <select id="demo-admin-duration">
            <option value="" selected disabled>Select</option>
            <option value="None">None</option>
            <option value="Less than 1 year">Less than 1 year</option>
            <option value="1-3 years">1-3 years</option>
            <option value="3-5 years">3-5 years</option>
            <option value="5+ years">5+ years</option>
          </select>
        </label>

        <label class="field">
          <span>Are you currently an active WhatsApp group admin?</span>
          <select id="demo-active-admin">
            <option value="" selected disabled>Select</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </label>

        <label class="field">
          <span>What type of WhatsApp group(s) do you admin or moderate?</span>
          <input id="demo-group-type" type="text" placeholder="e.g., Family, Friends, Work, Community, Religious" />
        </label>

        <label class="field" id="attention-check-field">
          <span id="attention-check-question">If you are reading this question carefully, please select "Somewhat Agree"</span>
          <select id="demo-attention-check">
            <option value="" selected disabled>Select your response</option>
            <option value="Strongly Disagree">Strongly Disagree</option>
            <option value="Disagree">Disagree</option>
            <option value="Somewhat Agree">Somewhat Agree</option>
            <option value="Agree">Agree</option>
            <option value="Strongly Agree">Strongly Agree</option>
          </select>
        </label>
      </div>

      <div class="button-group" style="display: flex; gap: 1rem; margin-top: 1.5rem;">
        <button id="submit-btn" class="primary" disabled>Submit</button>
      </div>

      <div id="submission-message" class="summary" hidden></div>
    </section>
  </main>

  <script src="exp2b_demographics.js"></script>
</body>
</html>
